name: Deploy landing to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "tangodb-landing/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tangodb-landing/package-lock.json

      - name: Install and build
        working-directory: tangodb-landing
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: tangodb-landing
        run: npx wrangler pages deploy dist --project-name=tangodb-landing --branch=main
